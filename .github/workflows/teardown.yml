name: "AWS: teardown (destroy)"

# Manual only. Two options:
# - costs: destroys data/ (S3 data lake, Redshift Serverless): everything
#          that costs money
# - full:  destroys data/ and base/ (API key parameter) and the Looker
#          password parameter: the whole project
#
# github-access/ (the roles this workflow logs in with) and the Terraform
# state bucket always stay, so "AWS: plan / deploy" ("Run workflow")
# can rebuild everything afterwards.
#
# Before anything is destroyed, the data lake is downloaded and attached to
# the run as an artifact ("data-lake-backup"): download it from the run page.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to tear down"
        type: choice
        options: [costs, full]
        required: true
      confirm:
        description: 'Type "destroy" and the scope: "destroy costs" or "destroy full"'
        required: true

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to AWS
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: aws # the deploy role trusts only jobs in this environment
    steps:
      - name: Check confirmation
        env:
          SCOPE: ${{ inputs.scope }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          expected="destroy $SCOPE"
          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::Confirmation must be \"$expected\" for scope $SCOPE. Nothing was destroyed."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Init parts
        run: |
          terraform -chdir=infrastructure/data init -input=false
          terraform -chdir=infrastructure/base init -input=false

      # 1. Back up the data lake. Nothing is destroyed if this fails.
      - name: Download the data lake
        id: backup
        run: |
          bucket=$(terraform -chdir=infrastructure/data output -raw bucket_name 2>/dev/null || true)
          if [ -z "$bucket" ] || ! aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
            echo "No data lake bucket found; nothing to back up."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          objects=$(aws s3 ls "s3://$bucket" --recursive | wc -l)
          if [ "$objects" -eq 0 ]; then
            echo "Bucket $bucket is empty; nothing to back up."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws s3 sync "s3://$bucket" backup/ --only-show-errors
          files=$(find backup -type f | wc -l)
          # An incomplete backup stops the teardown: nothing gets destroyed.
          if [ "$files" -ne "$objects" ]; then
            echo "::error::Backup incomplete: $files files downloaded, $objects objects in $bucket. Nothing was destroyed."
            exit 1
          fi
          echo "Backed up $files files ($(du -sh backup | cut -f1)) from $bucket"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Attach the backup to this run
        if: steps.backup.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-lake-backup
          path: backup/
          retention-days: 90 # the maximum; download it before it expires
          if-no-files-found: error

      # 2. Destroy. data/ first in both cases.
      - name: Destroy data/ (costs money)
        run: terraform -chdir=infrastructure/data destroy -input=false -auto-approve

      - name: Destroy base/ (API key parameter)
        if: inputs.scope == 'full'
        run: terraform -chdir=infrastructure/base destroy -input=false -auto-approve

      # Not a Terraform resource (bootstrap.sh creates it, outside state, so
      # the password never enters Terraform state). Kept by "costs" so Looker
      # Studio keeps working after a rebuild; removed by "full".
      - name: Delete the Looker password parameter
        if: inputs.scope == 'full'
        run: |
          name=/va-facilities-report/redshift/looker-reader-password
          if aws ssm get-parameter --name "$name" > /dev/null 2>&1; then
            aws ssm delete-parameter --name "$name"
            echo "Deleted $name"
          else
            echo "$name does not exist; nothing to delete"
          fi
